# Sweep run: 2-bit depth-3 50-tree seed42
# n_bits=2  max_depth=3  n_estimators=50  seed=42
[paths]
feature_dir = "features"
artifact_dir = "artifacts/report_runs/2b3d50t_s42"
log_dir = "fhe_logs/report_runs/2b3d50t_s42"

[features]
train_output = "features/hi-small/train_features.parquet"
valid_output = "features/hi-small/valid_features.parquet"
test_output  = "features/hi-small/test_features.parquet"

[model]
train_normal_rows = 3000000
eval_rows         = 0
n_estimators      = 50
max_depth         = 3
scale_pos_weight  = 3.0
learning_rate     = 0.12
subsample         = 0.7
colsample_bytree  = 0.5
random_seed       = 42

[fhe]
n_bits        = 2
compile_rows  = 1024
simulate_rows = 100000
execute_rows  = 20
mode          = "simulate"
