# Main small IBM AML lifecycle config.
# Model settings mirror the recommended report setting:
# 3-bit, depth-5, 50 trees, seed=1.

[paths]
raw_data_dir = "data"
staged_data_dir = "data"
feature_dir = "features"
artifact_dir = "artifacts/report_runs/3b5d50t_s1"
log_dir = "fhe_logs/report_runs/3b5d50t_s1"

[data]
dataset = "HI-Small"

[features]
train_output = "features/hi-small/train_features.parquet"
valid_output = "features/hi-small/valid_features.parquet"
test_output = "features/hi-small/test_features.parquet"

[model]
train_normal_rows = 3000000
eval_rows = 0
n_estimators = 50
max_depth = 5
scale_pos_weight = 3.0
learning_rate = 0.12
subsample = 0.7
colsample_bytree = 0.5
random_seed = 1

[fhe]
n_bits = 3
compile_rows = 1024
simulate_rows = 100000
execute_rows = 20
mode = "simulate"
